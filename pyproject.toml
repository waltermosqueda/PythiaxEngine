[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-titan"
version = "0.1.0"
description = "Quantitative market data pipeline and operational dashboards."
readme = "CLAUDE.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "yfinance>=0.2.54,<0.3",
]

[project.optional-dependencies]
cloud = [
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
]
dev = [
  "pre-commit>=4.2,<5",
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
]
research = [
  "lightgbm>=4.6,<5",
  "scikit-learn>=1.6,<2",
  "scipy>=1.15,<2",
  "xgboost>=2.1,<3",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["titan_system*", "SCANNER*", "herramientas*", "analisis*"]
namespaces = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]


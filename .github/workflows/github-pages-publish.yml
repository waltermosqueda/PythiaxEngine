name: GitHub Pages Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate committed cloud dashboard artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          snapshot_path = Path("dashboards/maquina_pensante/tablero_maquina_pensante_snapshot.json")
          if not snapshot_path.exists():
              raise SystemExit(f"Missing dashboard snapshot: {snapshot_path}")

          payload = json.loads(snapshot_path.read_text(encoding="utf-8"))
          build = payload.get("build") or {}
          db_backend = str(build.get("db_backend") or "")
          active = (payload.get("active") or {}).get("active_run") or {}

          if not db_backend.startswith("postgres"):
              raise SystemExit(
                  f"Refusing to publish non-cloud dashboard artifacts. db_backend={db_backend!r}"
              )
          if active.get("source") != "snapshot_db":
              raise SystemExit(
                  f"Refusing to publish artifacts built from fallback data. active_run.source={active.get('source')!r}"
              )

          print(json.dumps({
              "snapshot": str(snapshot_path),
              "db_backend": db_backend,
              "active_run_source": active.get("source"),
              "generated_at": payload.get("generated_at"),
              "latest_market_date": (payload.get("integrity") or {}).get("latest_market_date"),
          }, indent=2, ensure_ascii=False))
          PY

      - name: Stage GitHub Pages site
        run: python -m infra.publish.dashboard_site --source-dir dashboards/maquina_pensante --output-dir dist/github-pages

      - name: Validate staged site
        run: |
          test -f dist/github-pages/index.html
          test -f dist/github-pages/preview_c1_pro.html
          test -f dist/github-pages/tablero_maquina_pensante.html
          test -f dist/github-pages/tablero_maquina_pensante_executive.html
          test -f dist/github-pages/tablero_maquina_pensante_lab.html
          test -f dist/github-pages/tablero_maquina_pensante_snapshot.json
          test -f dist/github-pages/tablero_maquina_pensante_artifact_manifest.json
          test -f dist/github-pages/site_bundle_manifest.json
          test -f dist/github-pages/.nojekyll
          cmp -s dist/github-pages/index.html dist/github-pages/preview_c1_pro.html

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: pythiax-pages-publish-${{ github.run_id }}
          retention-days: 30
          path: |
            dashboards/maquina_pensante/
            dist/github-pages/
            dist/github-pages/site_bundle_manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record publish in pipeline ledger
        run: python -m infra.publish.record_pages_publish --site-dir dist/github-pages --page-url "${{ steps.deployment.outputs.page_url }}"

name: GitHub Pages Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production-pipeline
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage GitHub Pages site
        run: |
          mkdir -p dist/github-pages
          cp analisis/preview_c1_pro.html dist/github-pages/preview_c1_pro.html
          cp analisis/preview_c1_pro.html dist/github-pages/index.html
          touch dist/github-pages/.nojekyll

      - name: Validate staged site
        run: |
          test -f dist/github-pages/index.html
          test -f dist/github-pages/preview_c1_pro.html
          test -f dist/github-pages/.nojekyll
          cmp -s dist/github-pages/index.html dist/github-pages/preview_c1_pro.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/github-pages
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


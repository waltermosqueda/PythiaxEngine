name: GitHub Pages Publish

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'tests/**'
      - 'bitacora/**'
      - '.cache/**'
  workflow_dispatch:

concurrency:
  group: pages-production-pipeline
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHIAX_REQUIRE_CLOUD_DB: "1"
      PYTHONUNBUFFERED: "1"
      PYTHIAX_COMMIT_SHA: ${{ github.sha }}
      PYTHIAX_RUN_ID: ${{ github.run_id }}
      PYTHIAX_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Validate required secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply schema with Alembic
        run: alembic upgrade head

      - name: Run cloud-native pipeline
        id: cloud_pipeline
        continue-on-error: true
        run: |
          python -u herramientas/auto_actualizar.py --force-pipeline --skip-dashboard-refresh

      - name: Report cloud-native pipeline failure
        if: steps.cloud_pipeline.outcome != 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from datetime import date
          from pathlib import Path

          from herramientas.validate_market_data import check_ohlcv_integrity
          from titan_system.core.database import TitanDB

          alert_path = Path("aprendizaje_operativo/alerts/latest_critical_alert.json")
          if alert_path.exists():
              payload = json.loads(alert_path.read_text(encoding="utf-8"))
              code = payload.get("code") or "cloud_pipeline_failed"
              summary = payload.get("summary") or "Sin resumen"
              print(f"::error::cloud-native pipeline failed: {code} | {summary}")
              details = payload.get("details") or {}
              if details:
                  details_json = json.dumps(details, ensure_ascii=False, sort_keys=True)
                  print(f"::error::cloud-native pipeline details: {details_json[:1500]}")

              report_path_str = details.get("report_path") if isinstance(details, dict) else None
              if report_path_str:
                  report_path = Path(report_path_str)
                  if report_path.exists():
                      lines = [
                          line.strip()
                          for line in report_path.read_text(encoding="utf-8", errors="replace").splitlines()
                          if line.strip()
                      ]
                      interesting = [
                          line
                          for line in lines
                          if any(
                              marker in line
                              for marker in (
                                  "FAIL",
                                  "Frescura global",
                                  "Universo operativo",
                                  "Cobertura ultimo cierre",
                                  "Actualizar antes de correr aprendizaje o scanner",
                                  "SPY no tiene la ultima fecha global",
                                  "Faltan",
                              )
                          )
                      ]
                      excerpt = " | ".join((interesting[:6] or lines[-12:]))
                      if excerpt:
                          print(f"::error::cloud-native pipeline report excerpt: {excerpt[:1800]}")

              fecha_base_str = details.get("fecha_base") if isinstance(details, dict) else None
              if fecha_base_str:
                  try:
                      fecha_base = date.fromisoformat(str(fecha_base_str))
                  except ValueError:
                      fecha_base = None
                  if fecha_base is not None:
                      with TitanDB() as db:
                          severe_result = next(
                              (
                                  result
                                  for result in check_ohlcv_integrity(db, fecha_base)
                                  if result.name == "OHLCV severo"
                              ),
                              None,
                          )
                      if severe_result is not None:
                          print(
                              "::error::cloud-native severe ohlcv summary: "
                              f"{severe_result.summary}"
                          )
                          for detail in severe_result.details[:8]:
                              print(f"::error::cloud-native severe ohlcv detail: {detail}")

          freshness_path = Path("docs/cloud/reports/model_snapshot_freshness.json")
          if freshness_path.exists():
              payload = json.loads(freshness_path.read_text(encoding="utf-8"))
              latest_prices = payload.get("latest_prices_date")
              latest_prediction = payload.get("latest_prediction_date")
              missing_models = ", ".join(payload.get("missing_models") or []) or "-"
              print(
                  "::error::model snapshot freshness: "
                  f"latest_prices_date={latest_prices} | latest_prediction_date={latest_prediction} | "
                  f"missing_models={missing_models}"
              )
              for model in payload.get("models") or []:
                  print(
                      "::error::model snapshot freshness detail: "
                      f"label={model.get('label')} | role={model.get('role')} | status={model.get('status')} | "
                      f"analyzed_date={model.get('analyzed_date')} | prediction_for={model.get('prediction_for')} | "
                      f"signal_count={model.get('signal_count')} | latest_prediction_date={model.get('latest_prediction_date')} | "
                      f"latest_prediction_rows={model.get('latest_prediction_rows')} | total_prediction_rows={model.get('total_prediction_rows')} | "
                      f"prediction_days={model.get('prediction_days')}"
                  )

          log_path = Path("bitacora/auto_actualizar.log")
          if log_path.exists():
              tail = log_path.read_text(encoding="utf-8", errors="replace").splitlines()[-40:]
              print("---- auto_actualizar.log tail ----")
              for line in tail:
                  print(line)
          raise SystemExit(1)
          PY

      - name: Build dashboard bundle
        id: dashboard_bundle
        continue-on-error: true
        run: python -u analisis/generar_tablero_maquina_pensante.py --variant all

      - name: Report dashboard build failure
        if: steps.dashboard_bundle.outcome != 'success'
        continue-on-error: true
        run: |
          python - <<'PY'
          from infra.db import RuntimeDB, resolve_ci_run_id

          run_id = resolve_ci_run_id() or ""
          with RuntimeDB() as db:
              row = db.row(
                  """
                  SELECT run_id, status, error_message
                  FROM pipeline_runs
                  WHERE pipeline_name = 'dashboard_build' AND run_id LIKE ?
                  ORDER BY id DESC
                  LIMIT 1
                  """,
                  (f"dashboard_build-{run_id}%",),
              )
          if row:
              print(
                  "::error::dashboard build failed: "
                  f"run_id={row.get('run_id')} | status={row.get('status')} | error={row.get('error_message')}"
              )
          else:
              print("::error::dashboard build failed and no pipeline_runs row was found")
          raise SystemExit(1)
          PY

      - name: Stage GitHub Pages site
        run: python -m infra.publish.dashboard_site --source-dir dashboards/maquina_pensante --output-dir dist/github-pages

      - name: Run integrity audit
        id: integrity_audit
        continue-on-error: true
        run: |
          python -m infra.cloud.audit_dashboard_integrity \
            --snapshot-path dashboards/maquina_pensante/tablero_maquina_pensante_snapshot.json \
            --dashboard-dir dashboards/maquina_pensante \
            --site-dir dist/github-pages \
            --sample-size 5 \
            --seed 130013 \
            --report-path docs/cloud/reports/dashboard_integrity_audit.json

      - name: Report integrity audit failure
        if: steps.integrity_audit.outcome != 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from infra.cloud.audit_dashboard_integrity import build_expected_active_from_db
          from infra.db import RuntimeDB
          from herramientas.scanner_operativo_context import resolve_operational_scanner_context

          report_path = Path("docs/cloud/reports/dashboard_integrity_audit.json")
          if not report_path.exists():
              print("::error::integrity audit failed and no report file was generated")
              raise SystemExit(1)

          payload = json.loads(report_path.read_text(encoding="utf-8"))
          failures = payload.get("failures") or []
          if not failures:
              print("::error::integrity audit failed but report contained no failure details")
              raise SystemExit(1)

          first = failures[0]
          print(
              "::error::integrity audit failed: "
              f"label={first.get('label')} | actual={first.get('actual')} | expected={first.get('expected')}"
          )

          snapshot_path = Path("dashboards/maquina_pensante/tablero_maquina_pensante_snapshot.json")
          if snapshot_path.exists():
              snapshot = json.loads(snapshot_path.read_text(encoding="utf-8"))
              active_run = ((snapshot.get("active") or {}).get("active_run") or {})
              print(
                  "::error::generated snapshot active_run: "
                  f"regime_label={active_run.get('regime_label')!r} | analyzed_date={active_run.get('analyzed_date')!r} | "
                  f"prediction_for={active_run.get('prediction_for')!r} | source={active_run.get('source')!r}"
              )

          staged_snapshot_path = Path("dist/github-pages/tablero_maquina_pensante_snapshot.json")
          if staged_snapshot_path.exists():
              staged_snapshot = json.loads(staged_snapshot_path.read_text(encoding="utf-8"))
              staged_active_run = ((staged_snapshot.get("active") or {}).get("active_run") or {})
              print(
                  "::error::staged snapshot active_run: "
                  f"regime_label={staged_active_run.get('regime_label')!r} | analyzed_date={staged_active_run.get('analyzed_date')!r} | "
                  f"prediction_for={staged_active_run.get('prediction_for')!r} | source={staged_active_run.get('source')!r}"
              )

          with RuntimeDB() as db:
              expected_active = build_expected_active_from_db(db)
              operational = resolve_operational_scanner_context()
              active_label = f"V{operational.active_version}"
              active_prefix = f"INVERTIR_V{operational.active_version}"
              snapshot_row = db.execute(
                  """
                  SELECT model_key, analyzed_date, prediction_for, freshness, regime_label, signal_count, snapshot_json
                  FROM model_run_snapshots
                  WHERE model_key = ?
                  ORDER BY analyzed_date DESC
                  LIMIT 1
                  """,
                  (active_label,),
              ).fetchone()

              if snapshot_row is None:
                  print(f"::error::active model snapshot row: model_key={active_label} | missing=true")
              else:
                  snapshot_payload = {}
                  snapshot_json = snapshot_row[6]
                  if snapshot_json:
                      try:
                          loaded = json.loads(snapshot_json)
                      except Exception as exc:
                          print(f"::error::active model snapshot payload parse error: {exc}")
                      else:
                          if isinstance(loaded, dict):
                              snapshot_payload = loaded
                  payload_keys = ",".join(sorted(snapshot_payload.keys())[:20]) or "-"
                  print(
                      "::error::active model snapshot row: "
                      f"model_key={snapshot_row[0]} | analyzed_date={snapshot_row[1]!r} | prediction_for={snapshot_row[2]!r} | "
                      f"freshness={snapshot_row[3]!r} | regime_label={snapshot_row[4]!r} | signal_count={snapshot_row[5]!r} | "
                      f"snapshot_json_len={len(snapshot_json or '')} | payload_keys={payload_keys}"
                  )

              for model_name in [f"{active_prefix}_D_D10", f"{active_prefix}_E_D15"]:
                  latest_prediction_date = db.scalar(
                      "SELECT MAX(prediction_date) FROM predictions WHERE model_name = ?",
                      (model_name,),
                  )
                  total_prediction_rows = db.scalar(
                      "SELECT COUNT(*) FROM predictions WHERE model_name = ?",
                      (model_name,),
                  )
                  latest_prediction_rows = 0
                  if latest_prediction_date:
                      latest_prediction_rows = int(
                          db.scalar(
                              "SELECT COUNT(*) FROM predictions WHERE model_name = ? AND prediction_date = ?",
                              (model_name, latest_prediction_date),
                          )
                          or 0
                      )
                  print(
                      "::error::active model prediction coverage: "
                      f"model_name={model_name} | latest_prediction_date={latest_prediction_date!r} | "
                      f"latest_prediction_rows={latest_prediction_rows} | total_prediction_rows={int(total_prediction_rows or 0)}"
                  )
          print(
              "::error::expected active_run from db: "
              f"regime_label={expected_active.get('regime_label')!r} | analyzed_date={expected_active.get('analyzed_date')!r} | "
              f"prediction_for={expected_active.get('prediction_for')!r}"
          )
          raise SystemExit(1)
          PY

      - name: Validate generated bundle
        run: |
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_snapshot.json
          test -f dashboards/maquina_pensante/tablero_maquina_pensante.html
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_executive.html
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_lab.html
          test -f dashboards/maquina_pensante/preview_c1_pro.html
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_artifact_manifest.json

      - name: Validate staged site
        run: |
          test -f dist/github-pages/index.html
          test -f dist/github-pages/preview_c1_pro.html
          test -f dist/github-pages/tablero_maquina_pensante.html
          test -f dist/github-pages/tablero_maquina_pensante_executive.html
          test -f dist/github-pages/tablero_maquina_pensante_lab.html
          test -f dist/github-pages/tablero_maquina_pensante_snapshot.json
          test -f dist/github-pages/tablero_maquina_pensante_artifact_manifest.json
          test -f dist/github-pages/site_bundle_manifest.json
          test -f dist/github-pages/.nojekyll
          cmp -s dist/github-pages/index.html dist/github-pages/preview_c1_pro.html

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v7
        with:
          name: pythiax-pages-publish-${{ github.run_id }}
          retention-days: 30
          path: |
            dashboards/maquina_pensante/
            docs/cloud/reports/dashboard_integrity_audit.json
            dist/github-pages/
            dist/github-pages/site_bundle_manifest.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/github-pages
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record publish in pipeline ledger
        run: python -m infra.publish.record_pages_publish --site-dir dist/github-pages --page-url "${{ steps.deployment.outputs.page_url }}"

      - name: Sync dashboard HTML back to repo (for Cloudflare Pages)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp dist/github-pages/preview_c1_pro.html analisis/preview_c1_pro.html
          git add analisis/preview_c1_pro.html
          git diff --staged --quiet || git commit -m "chore(auto): sync dashboard HTML [skip ci]" && git push

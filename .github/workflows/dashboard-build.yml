name: Dashboard Build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 2-6"

concurrency:
  group: dashboard-build
  cancel-in-progress: false

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHIAX_COMMIT_SHA: ${{ github.sha }}
      PYTHIAX_RUN_ID: ${{ github.run_id }}
      PYTHIAX_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build dashboard bundle
        run: python analisis/generar_tablero_maquina_pensante.py --variant all

      - name: Validate generated bundle
        run: |
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_snapshot.json
          test -f dashboards/maquina_pensante/tablero_maquina_pensante.html
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_executive.html
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_lab.html
          test -f dashboards/maquina_pensante/preview_c1_pro.html
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_artifact_manifest.json

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: pythiax-dashboard-${{ github.run_id }}
          retention-days: 30
          path: dashboards/maquina_pensante/

name: Dashboard Build

on:
  workflow_dispatch:

concurrency:
  group: dashboard-build
  cancel-in-progress: false

jobs:
  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHIAX_REQUIRE_CLOUD_DB: "1"
      PYTHIAX_COMMIT_SHA: ${{ github.sha }}
      PYTHIAX_RUN_ID: ${{ github.run_id }}
      PYTHIAX_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Apply schema with Alembic
        run: alembic upgrade head

      - name: Purge corporate-action-contaminated outcomes
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          url = os.environ["DATABASE_URL"]
          engine = create_engine(url)
          with engine.begin() as conn:
              result = conn.execute(text("""
                  DELETE FROM outcomes
                  WHERE id IN (
                      SELECT o.id FROM outcomes o
                      WHERE ABS(o.actual_return) > 0.50
                  )
              """))
              print(f"[CORP-ACTION-GUARD] Purged {result.rowcount} outcome(s) with |return| > 50%")
          engine.dispose()
          PY

      - name: Run cloud-native pipeline
        run: |
          python herramientas/auto_actualizar.py --skip-dashboard-refresh

      - name: Cooldown before dashboard build
        run: echo "Waiting 60s for Supabase connection pool recovery..." && sleep 60

      - name: Build dashboard bundle
        timeout-minutes: 20
        run: |
          timeout 540 python analisis/generar_tablero_maquina_pensante.py --variant all || \
          (echo "::warning::Build failed or timed out, retrying after 90s cooldown..." && sleep 90 && \
           python analisis/generar_tablero_maquina_pensante.py --variant all)

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Stage GitHub Pages site
        run: python -m infra.publish.dashboard_site --source-dir dashboards/maquina_pensante --output-dir dist/github-pages

      - name: Run integrity audit
        timeout-minutes: 10
        continue-on-error: true
        run: |
          python -m infra.cloud.audit_dashboard_integrity \
            --snapshot-path dashboards/maquina_pensante/tablero_maquina_pensante_snapshot.json \
            --dashboard-dir dashboards/maquina_pensante \
            --site-dir dist/github-pages \
            --sample-size 5 \
            --seed 130013 \
            --lightweight \
            --report-path docs/cloud/reports/dashboard_integrity_audit.json

      - name: Debug audit report
        if: always()
        run: |
          echo "Listing docs/cloud/reports"
          ls -la docs/cloud/reports || true
          if [ -f docs/cloud/reports/dashboard_integrity_audit.json ]; then
            echo "Audit report exists — showing head"
            head -n 200 docs/cloud/reports/dashboard_integrity_audit.json || true
          else
            echo "No audit report found"
          fi

      - name: Validate generated bundle
        run: |
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_snapshot.json
          test -f dashboards/maquina_pensante/tablero_maquina_pensante.html
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_executive.html
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_lab.html
          test -f dashboards/maquina_pensante/preview_c1_pro.html
          test -f dashboards/maquina_pensante/tablero_maquina_pensante_artifact_manifest.json

      - name: Validate staged site
        run: |
          test -f dist/github-pages/index.html
          test -f dist/github-pages/preview_c1_pro.html
          test -f dist/github-pages/tablero_maquina_pensante.html
          test -f dist/github-pages/tablero_maquina_pensante_executive.html
          test -f dist/github-pages/tablero_maquina_pensante_lab.html
          test -f dist/github-pages/tablero_maquina_pensante_snapshot.json
          test -f dist/github-pages/tablero_maquina_pensante_artifact_manifest.json
          test -f dist/github-pages/site_bundle_manifest.json
          test -f dist/github-pages/.nojekyll
          cmp -s dist/github-pages/index.html dist/github-pages/preview_c1_pro.html

      - name: Upload dashboard artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pythiax-dashboard-${{ github.run_id }}
          retention-days: 30
          path: |
            dashboards/maquina_pensante/
            dist/github-pages/
            docs/cloud/reports/

      - name: Upload Pages artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/github-pages
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Record publish in pipeline ledger
        run: python -m infra.publish.record_pages_publish --site-dir dist/github-pages --page-url "${{ steps.deployment.outputs.page_url }}"

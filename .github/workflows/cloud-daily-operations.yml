name: Cloud Daily Operations

on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 1-5"   # 18:30 AR — post-cierre NYSE (verano: 17:00 AR / invierno: 18:00 AR)
    # NOTA EGRESS (2026-05-20): Removidos fallback nocturno (0 1) y sanidad matutina (0 11).
    # Cada run del pipeline diario consume ~300 MB de Supabase egress.
    # 3 runs/día × 300 MB × 22 días = 19.8 GB/mes > 5 GB free tier.
    # 1 run/día × 300 MB × 22 días = 6.6 GB — cerca del límite, más manejable.
    # Si el run falla: usar workflow_dispatch para reintentar manualmente.

concurrency:
  group: pages-production-pipeline
  cancel-in-progress: false

jobs:
  cloud-daily-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHIAX_REQUIRE_CLOUD_DB: "1"
      TZ: America/Buenos_Aires
      PYTHIAX_COMMIT_SHA: ${{ github.sha }}
      PYTHIAX_RUN_ID: ${{ github.run_id }}
      PYTHIAX_RUN_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing. Add it in Settings → Secrets → Actions as 'DATABASE_URL'."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Test DB connection (temporal)
        run: |
          echo "Testing DATABASE_URL connection..."
          python - <<'PY'
          import os, sys, traceback
          from sqlalchemy import create_engine, text

          url = os.environ.get('DATABASE_URL')
          if not url:
              print('DATABASE_URL missing in environment', file=sys.stderr)
              sys.exit(1)
          try:
              engine = create_engine(url)
              conn = engine.connect()
              val = conn.execute(text('SELECT 1')).scalar()
              conn.close()
              print('[DB OK]', val)
          except Exception:
              print('[DB ERROR] Could not connect or execute query.', file=sys.stderr)
              traceback.print_exc()
              sys.exit(1)
          PY
          echo "If you see [DB OK] 1 above, the connection is valid."

      - name: Apply schema with Alembic
        run: alembic upgrade head

      - name: Run cloud-native pipeline
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run detected → forcing full pipeline (--force-pipeline)"
            python herramientas/auto_actualizar.py --force-pipeline
          else
            python herramientas/auto_actualizar.py
          fi

      - name: Decide cloud refresh
        id: refresh
        if: '!cancelled()'
        run: |
          FORCE_ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FORCE_ARGS="--force"
          fi
          python -m infra.cloud.decide_cloud_refresh --github-output "$GITHUB_OUTPUT" --max-stale-hours 20 $FORCE_ARGS

      - name: Audit prices live
        if: "!cancelled() && steps.refresh.outputs.should_refresh == 'true'"
        continue-on-error: true
        run: |
          python herramientas/audit_precios_live.py \
            --output analisis/verify_payload.json \
            --max-open 30 \
            --max-closed 12


      # Always rebuild dashboard and snapshot artifacts before audit
      - name: Build dashboard bundle (ALWAYS)
        if: '!cancelled()'
        run: python analisis/generar_tablero_maquina_pensante.py --variant all


      - name: Stage GitHub Pages site (ALWAYS)
        if: '!cancelled()'
        run: python -m infra.publish.dashboard_site --source-dir dashboards/maquina_pensante --output-dir dist/github-pages

      - name: Audit DB vs dashboard vs site (ALWAYS)
        if: '!cancelled()'
        id: audit
        timeout-minutes: 10
        run: |
          set +e
          mkdir -p docs/cloud/reports
          echo "Running dashboard audit..."
          python -m infra.cloud.audit_dashboard_integrity \
            --snapshot-path dashboards/maquina_pensante/tablero_maquina_pensante_snapshot.json \
            --dashboard-dir dashboards/maquina_pensante \
            --site-dir dist/github-pages \
            --sample-size 5 \
            --seed 130013 \
            --report-path docs/cloud/reports/dashboard_integrity_audit.json
          audit_exit=$?
          set -e
          echo "AUDIT_EXIT=$audit_exit" >> $GITHUB_ENV
          if [ "$audit_exit" -ne 0 ]; then
            echo "::warning::Audit failed with exit code $audit_exit — continuing to upload artifacts for debugging."
            if [ ! -f docs/cloud/reports/dashboard_integrity_audit.json ]; then
              echo '{"error":"audit_failed","exit_code":'"$audit_exit"'}' > docs/cloud/reports/dashboard_integrity_audit.json
            fi
          fi

      - name: Upload audit reports (ALWAYS)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pythiax-dashboard-reports-${{ github.run_id }}
          path: |
            docs/cloud/reports/dashboard_integrity_audit.json
            docs/cloud/reports/model_snapshot_freshness.json
          if-no-files-found: warn

      - name: Fail if audit failed
        if: "!cancelled() && env.AUDIT_EXIT != '0'"
        run: |
          echo "Audit exit code: $AUDIT_EXIT"
          exit $AUDIT_EXIT

      - name: Validate staged site
        if: "!cancelled() && steps.refresh.outputs.should_refresh == 'true'"
        run: |
          test -f dist/github-pages/index.html
          test -f dist/github-pages/preview_c1_pro.html
          test -f dist/github-pages/tablero_maquina_pensante.html
          test -f dist/github-pages/tablero_maquina_pensante_executive.html
          test -f dist/github-pages/tablero_maquina_pensante_lab.html
          test -f dist/github-pages/tablero_maquina_pensante_snapshot.json
          test -f dist/github-pages/tablero_maquina_pensante_artifact_manifest.json
          test -f dist/github-pages/site_bundle_manifest.json
          test -f dist/github-pages/.nojekyll
          cmp -s dist/github-pages/index.html dist/github-pages/preview_c1_pro.html

      - name: Report refresh decision
        if: steps.refresh.outputs.should_refresh != 'true'
        run: |
          echo "No cloud refresh needed."
          echo "latest_prices_date=${{ steps.refresh.outputs.latest_prices_date }}"
          echo "last_publish_market_date=${{ steps.refresh.outputs.last_publish_market_date }}"
          echo "snapshot_newer_than_publish=${{ steps.refresh.outputs.snapshot_newer_than_publish }}"

      - name: Upload cloud operations artifact
        if: "!cancelled() && steps.refresh.outputs.should_refresh == 'true'"
        uses: actions/upload-artifact@v7
        with:
          name: pythiax-cloud-daily-${{ github.run_id }}
          retention-days: 30
          path: |
            dashboards/maquina_pensante/
            dist/github-pages/
            docs/cloud/reports/model_snapshot_freshness.json
            docs/cloud/reports/dashboard_integrity_audit.json

      - name: Upload Pages artifact
        if: "!cancelled() && steps.refresh.outputs.should_refresh == 'true'"
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/github-pages
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        if: "!cancelled() && steps.refresh.outputs.should_refresh == 'true'"
        uses: actions/deploy-pages@v5

      - name: Record publish in pipeline ledger
        if: "!cancelled() && steps.refresh.outputs.should_refresh == 'true'"
        run: python -m infra.publish.record_pages_publish --site-dir dist/github-pages --page-url "${{ steps.deployment.outputs.page_url }}"

      - name: Sync dashboard HTML back to repo (para Cloudflare Pages)
        if: "!cancelled() && steps.refresh.outputs.should_refresh == 'true'"
        run: |
          if [ ! -f dist/github-pages/preview_c1_pro.html ]; then
            echo "No generated HTML found, skipping sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp dist/github-pages/preview_c1_pro.html analisis/preview_c1_pro.html
          # Ensure a clean working tree before committing/pulling to avoid rebase errors
          git reset --hard HEAD || true
          git clean -fd || true
          git add analisis/preview_c1_pro.html
          if git diff --staged --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore(auto): sync dashboard HTML"
            # Pull-rebase en caso de push concurrente a main
            # -X theirs = en conflictos, priorizar nuestro HTML generado
            git pull --rebase -X theirs origin main || true
            git push || echo "Warning: git push failed — branch protection or network issue"
          fi

      - name: Send daily trader report
        if: "!cancelled() && steps.refresh.outputs.should_refresh == 'true'"
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/reporte_diario_trader.py

      - name: Update ESTADO_ACTUAL.md (auto-generado al final del pipeline)
        if: always()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python scripts/generar_estado_actual.py --write
          git add ESTADO_ACTUAL.md
          if git diff --staged --quiet; then
            echo "ESTADO_ACTUAL sin cambios — omitiendo commit"
          else
            git commit -m "chore(auto): update ESTADO_ACTUAL → ${{ github.sha }} [skip ci]"
            # Limpiar working tree antes del rebase para evitar "uncommitted changes"
            git checkout -- .
            git pull --rebase -X theirs origin main || {
              echo "::warning::rebase falló — abortando"
              git rebase --abort 2>/dev/null || true
              exit 0
            }
            git push origin main || echo "::warning::push ESTADO_ACTUAL falló — no es crítico"
          fi

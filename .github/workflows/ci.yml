name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Syntax smoke
        run: python -m compileall titan_system herramientas SCANNER analisis infra alembic tests

      - name: Unit tests
        id: unit_tests
        continue-on-error: true
        run: python -m pytest tests --junitxml=pytest-results.xml

      - name: Emit pytest annotations
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.unit_tests.outcome }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import sys
          import xml.etree.ElementTree as ET

          junit_path = Path("pytest-results.xml")
          failures = []

          if junit_path.exists():
              root = ET.parse(junit_path).getroot()
              for case in root.iter("testcase"):
                  case_name = ".".join(
                      part
                      for part in [case.attrib.get("classname"), case.attrib.get("name")]
                      if part
                  )
                  for tag in ("failure", "error"):
                      for node in case.findall(tag):
                          raw_message = (node.attrib.get("message") or (node.text or "")).strip()
                          message = raw_message.splitlines()[0][:280] if raw_message else "pytest failure"
                          print(f"::error title=pytest::{case_name} - {message}")
                          failures.append(case_name)
          else:
              print("::error title=pytest::pytest-results.xml was not generated")
              failures.append("missing-junit-report")

          if failures or os.getenv("PYTEST_OUTCOME") != "success":
              sys.exit(1)
          PY

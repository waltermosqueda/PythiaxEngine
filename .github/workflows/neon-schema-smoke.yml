name: Cloud Postgres Smoke

on:
  workflow_dispatch:

jobs:
  cloud-postgres-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate DATABASE_URL shape
        run: python -m infra.db.validate_database_url

      - name: Apply schema with Alembic
        run: alembic upgrade head

      - name: Smoke runtime connection
        run: |
          mkdir -p docs/cloud/reports
          python - <<'PY'
          import json
          from pathlib import Path

          from infra.db.runtime import RuntimeDB

          report_path = Path("docs/cloud/reports/cloud_postgres_smoke.json")
          with RuntimeDB() as db:
              payload = {
                  "backend": db.backend.name,
                  "database_url": db.backend.database_url,
                  "prices_count": int(db.scalar("SELECT COUNT(*) FROM prices") or 0),
                  "predictions_count": int(db.scalar("SELECT COUNT(*) FROM predictions") or 0),
                  "outcomes_count": int(db.scalar("SELECT COUNT(*) FROM outcomes") or 0),
                  "regimes_count": int(db.scalar("SELECT COUNT(*) FROM regimes") or 0),
                  "data_status_count": int(db.scalar("SELECT COUNT(*) FROM data_status") or 0),
              }

          report_path.write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, ensure_ascii=False))
          PY

      - name: Upload smoke report
        uses: actions/upload-artifact@v7
        with:
          name: cloud-postgres-smoke-report
          path: docs/cloud/reports/cloud_postgres_smoke.json

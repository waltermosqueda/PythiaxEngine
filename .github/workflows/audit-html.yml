name: Audit HTML / Injected Scripts

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  scan-for-injections:
    name: Scan repository for injected scripts or publishable keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for suspicious patterns (exclude backups and .orig)
        run: |
          set -euo pipefail
          patterns='live-prices-v1|sb_publishable|supabase.co/rest/v1|Authorization: Bearer|\\bapikey\\b|SB_KEY|sb_publishable|publishable|SUPABASE_ANON_KEY|sb_'
          echo "Scanning for: $patterns"
          matches=$(git grep -nE "$patterns" -- ':!backups' ':!**/*.orig' || true)
          if [ -n "$matches" ]; then
            echo "Suspicious patterns found (excluded backups and .orig):"
            echo "$matches"
            exit 1
          else
            echo "No suspicious patterns found (excluded backups and .orig)."
          fi

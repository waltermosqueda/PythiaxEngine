name: Intraday MTM Refresh

# ── Corridas automáticas intraday — horario cada hora durante la rueda ───────
# NYSE abre 09:30 ET:
#   Verano (EDT, UTC-4):  13:30–20:00 UTC = 10:30–17:00 AR
#   Invierno (EST, UTC-5): 14:30–21:00 UTC = 11:30–18:00 AR
#
# Cobertura horaria: 13:30–20:30 UTC cubre ambas estaciones completas.
# GitHub Actions puede demorar 10-30 min en disparar los crons, lo cual
# es aceptable para actualizaciones MTM de precio.
#
# Las actualizaciones post-cierre definitivas (ML pipeline, outcomes,
# rebuild completo) siguen siendo responsabilidad de cloud-daily-operations.
#
# Costo Supabase por run: ~50-200 KB egress (queries selectivos, no full scan).
# 8 runs/día × 22 días = ~30 MB/mes → <1% del free tier (5 GB).

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 10:30 AR — apertura NYSE verano / pre-apertura invierno
    - cron: "30 14 * * 1-5"   # 11:30 AR — apertura NYSE invierno / +1h verano
    - cron: "30 15 * * 1-5"   # 12:30 AR
    - cron: "30 16 * * 1-5"   # 13:30 AR
    - cron: "30 17 * * 1-5"   # 14:30 AR
    - cron: "30 18 * * 1-5"   # 15:30 AR
    - cron: "30 19 * * 1-5"   # 16:30 AR — pre-cierre NYSE verano
    - cron: "30 20 * * 1-5"   # 17:30 AR — cierre NYSE invierno / post-cierre verano
    - cron: "24 21 7 5 *"    # ONE-TIME: test post-fix 2026-05-07 (eliminar luego)
  workflow_dispatch:           # permite trigger manual para testing

concurrency:
  group: intraday-mtm-refresh
  cancel-in-progress: true     # si hay uno corriendo, el nuevo lo cancela

jobs:
  mtm-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20        # liviano: no debe tomar más de 5 min reales
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHIAX_REQUIRE_CLOUD_DB: "1"
      TZ: America/Buenos_Aires
      PYTHIAX_COMMIT_SHA: ${{ github.sha }}
      PYTHIAX_RUN_ID: ${{ github.run_id }}
      PYTHIAX_RUN_ATTEMPT: ${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate required secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is missing."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements-prod.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-prod.txt

      # ── PASO 1: Upsert precios intraday para tickers con picks abiertos ──
      - name: Update intraday prices (MTM)
        id: mtm_prices
        run: |
          python herramientas/mtm_intraday.py --days-back 10

      # ── PASO 2: Regenerar snapshot + HTML del dashboard ──────────────────
      # Usa el mismo comando que cloud-daily-operations. El snapshot recalcula
      # el MTM provisional automáticamente desde la tabla prices actualizada.
      - name: Build dashboard bundle
        run: python analisis/generar_tablero_maquina_pensante.py --variant all

      # ── PASO 3: Staging del sitio ─────────────────────────────────────────
      - name: Stage GitHub Pages site
        run: |
          python -m infra.publish.dashboard_site \
            --source-dir dashboards/maquina_pensante \
            --output-dir dist/github-pages

      # ── PASO 4: Validación mínima ─────────────────────────────────────────
      - name: Validate staged site
        run: |
          test -f dist/github-pages/index.html
          test -f dist/github-pages/preview_c1_pro.html
          test -f dist/github-pages/tablero_maquina_pensante_snapshot.json
          test -f dist/github-pages/.nojekyll
          cmp -s dist/github-pages/index.html dist/github-pages/preview_c1_pro.html

      # ── PASO 5: Deploy ────────────────────────────────────────────────────
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/github-pages
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # ── PASO 6: Sync HTML → git para que Cloudflare Pages también se actualice ─
      - name: Sync dashboard HTML back to repo (para Cloudflare Pages)
        run: |
          if [ ! -f dist/github-pages/preview_c1_pro.html ]; then
            echo "No generated HTML found, skipping sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp dist/github-pages/preview_c1_pro.html analisis/preview_c1_pro.html
          git add analisis/preview_c1_pro.html
          if git diff --staged --quiet; then
            echo "No changes to sync"
          else
            git commit -m "chore(auto): sync dashboard HTML intraday"
            git pull --rebase -X theirs origin main
            git push
          fi
